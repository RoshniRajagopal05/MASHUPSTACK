<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let students = [
            { name : "Roshni", score : 50 },
            { name : "Alin", score : 80},
            { name : "Aparna", score : 90},
            { name : "Midhula", score : 100},
            { name : "Saveri", score : 30 },
            { name : "Sethu", score : 20 },
        ]

        //List all student names.
        console.log(" This is the listing of all student names ")
        for (i = 0; i < students.length; i++){
            console.log(students[i].name);
        }

        //Create a new array that shows only the names of students who scored more than 60.
        let passedAbove60 = [];
        for (i = 0; i < students.length; i++){
            if(students[i].score > 60){
                passedAbove60.push(students[i].name, students[i].score)
                console.log("The students who scored above 60 --", passedAbove60)
            }
        }
        

        //Find the total score of all students
          let totalScore = 0;

          for (i = 0; i < students.length; i++){
            totalScore = totalScore + students[i].score;
            console.log("Total score of all the studentes is : ", totalScore);
          }
        

          // Check if all students passed (score > 35)

          let allPassed = students.every(function(student) {
            return student.score > 35;
          });

          console.log ("Students who scored above 35 -- ", allPassed);
           

          let passedStudents = students.filter(function(student){
            return student.score > 35;
          });

          console.log("Students who scored above 35 : ");

          for(i = 0; i < passedStudents.length; i++){
            console.log(passedStudents[i].name + " - " + passedStudents[i].score);
          }

          //Check if at least one student scored more than 90.

          hasAbove90 = students.some(function(student){
            return student.score > 90;

          });

          console.log("Students scored above 90 :", hasAbove90)
          

        students.sort (function(a,b) {
           return b.score - a.score;
          })

          console.log("Students soted by score : ");

          for (i = 0; i < students.length; i++){
            console.log(students[i].name, students[i].score);
          }

    </script>
</body>
</html>
