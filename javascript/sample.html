
<!DOCTYPE html>
<html>
<body>

<h2>JavaScript For Loop</h2>

<p id="demo"></p>

<script>
var fruits = ["watermelon", "banana", "guava", "orange", "apple"];
var i, len, text;
for (i = 0, len = fruits.length, text = ""; i < len; i++) {
  text += fruits[i] + "<br>";
}
document.getElementById("demo").innerHTML = text;
console.log(text);
</script>
</body>
</html>
