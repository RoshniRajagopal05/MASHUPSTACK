<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let comment = "I think this movie was BAD and 100% Stupid! But the Acting was Amazing and 3 actors were great"
        console.log(comment);
         
        function  filterComment (filteredComment) {

        
         // Replacing banned words
        let commentContains = filteredComment.replace(/bad|ugly|stupid/gi, " *** ");

         // Count numbers
        let numbers = filteredComment.match(/\d+/g) || [];
        let numberCount = numbers.length;

        //Count capitalized words
        let capitalWords = filteredComment.match(/\b[A-Z][a-zA-Z]*\b/g) || [];
        console.log(capitalWords);
        let capitalWordCount = capitalWords.length;


        //Return final message
        return `CommentContains: ${commentContains}
        Number Count : ${numberCount}
        Capitalized Word Count : ${capitalWordCount} `
     }

     console.log( filterComment(comment));
    </script>
</body>
</html>
