    <p id="p1"></p>

    <button onclick="adminChecker(user)"> Click on this Button</button>

        let user = {

            isAdmin : true

        }

        console.log("Checks whether the user is old enough to access admin features ");
        console.log("age should be 18 or more and user must be admin")

        function adminChecker(profile){
           
            let result = profile.age >= 18  &&  profile.isAdmin === true
            ? "Access Granted"
            : "Access Denied."
            console.log(result);
            document.getElementById("p1").innerHTML = result

             let ageExist = "age" in user;
        console.log(`The age property exist in the object user : ${ageExist}`);
        document.getElementById("p2").innerHTML = ageExist

        delete user.age 
        console.log(user);
        }

       
        

    
    </script>
