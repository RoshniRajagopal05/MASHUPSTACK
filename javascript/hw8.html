    <script>

     let chances = 5;
     let guessedCorrectly = false;

     for (i = 0; i < chances; i++){
        

        let guessedNumber = Number(prompt("Enter a number (1-5)"));

        if (guessedNumber < 1 || guessedNumber > 5){
          console.log("Invalid Input");
          chances++;
          continue;
        }

        switch(guessedNumber){
               case 1 : 
                    guessedNumber = 1;
                    console.log("The entered number is One. Wrong guess. Try again.");
                    break

               case 2 :
                    guessedNumber = 2;
                    console.log("The entered number is Two. Wrong guess. Try again.");  
                    break

               case 3 :
                    guessedNumber = 3;
                    console.log(" The entered number is Three. You guessed it right!");  
                    break  

               case 4:
                    guessedNumber = 4;
                    console.log("The entered number is Four. Wrong guess. Try again.") 
                    break

               case 5:
                    guessedNumber = 5;
                    console.log("The entered number is Five. Wrong guess. Try again.") 
                    break

              
                          

        }
      }   
           
      if ( guessedCorrectly === false ) {
          console.log("Game Over");
      }
    </script>
</body>
