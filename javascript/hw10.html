<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let feedback = `{
            "name " : "Roshni",
            "message" : "Thank you for the wonderful service!!!"
        }`;
        console.log(feedback);
        
        let userfeedback;
         try{
         userfeedback = JSON.parse(feedback);
         console.log(userfeedback.message);
         }  catch (error) {
         console.log(error);
         console.log("Invalid json")
         }

        const checkFeedback = () => {
            if(/thank/i.test(userfeedback.message)){
                console.log("Positive feedback received!!");
            } else {
                console.log("Feedback noted");
                
            }

        };
        
        checkFeedback();

    </script>
</body>
</html>
